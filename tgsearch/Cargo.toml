[package]
name = "tgsearch"
version = "0.1.0"
edition = "2021"

[dependencies]
# rusqlite with bundled features compiles SQLite natively, avoiding system dependencies
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
chrono = "0.4"
fuzzy-rank = { path = "../../fuzzy-rank" }
