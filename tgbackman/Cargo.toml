[package]
name = "tgbackman"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
eframe = "0.27"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"

[profile.release]
# Keep optimized execution while retaining source-line lookup in the shipped
# artifact; packaging may split the debug sections. This does not enable
# verbose runtime logging.
debug = "line-tables-only"
strip = "none"
panic = "unwind"
lto = "thin"
codegen-units = 1
